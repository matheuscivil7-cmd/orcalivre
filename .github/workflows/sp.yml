name: Radar alto padrão SP

on:
  schedule:
    # Todo dia às 07h40 de Brasília
    - cron: "40 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: radar-sp

jobs:
  sp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q openpyxl googlenewsdecoder
      - run: python -u robo/sp_alto.py
      - name: Publicar no site
        run: |
          git config user.name "orcalivre-robo"
          git config user.email "actions@users.noreply.github.com"
          git add -A dados/obras/sp_*
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Radar alto padrão SP: atualização diária"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done

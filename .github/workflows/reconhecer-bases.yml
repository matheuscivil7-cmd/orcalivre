name: Reconhecer bases (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      bases:
        description: "Bases separadas por espaço (vazio = todas)"
        default: ""

jobs:
  reconhecer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 xlrd==2.0.1 py7zr==0.22.0 pypdf==5.1.0
      - name: Baixar amostras e mostrar a estrutura
        run: python robo/reconhecer.py ${{ github.event.inputs.bases }}

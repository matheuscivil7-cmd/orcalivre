name: Baixar amostras (diagnóstico)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python robo/amostras.py /tmp/amostras
      - name: Publicar no ramo amostras
        run: |
          cd /tmp/amostras
          git init -b amostras
          git config user.name "orcalivre-robo"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "amostras"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras

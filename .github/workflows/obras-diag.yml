name: Obras privadas (diagnóstico das fontes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python robo/obras_diag.py /tmp/diag
      - name: Publicar no ramo obras-diag
        run: |
          cd /tmp/diag
          git init -b obras-diag
          git config user.name "orcalivre-robo"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "diagnóstico"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" obras-diag

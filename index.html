<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrçaLivre</title>
<meta name="description" content="Orçamento de obras gratuito com SINAPI (27 estados, desonerado e não desonerado), curva ABC, BDI, cronograma e relatórios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d5a94'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3ER$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: bancada de trabalho — trilho de módulos fixo à esquerda e a planilha ocupando a largura; no celular o trilho vira faixa de abas no topo */
:root{
  --bg:#e9edf0; --panel:#fbfcfd; --sunk:#e1e6ea; --ink:#14202b; --muted:#566573; --line:#cdd5dc;
  --accent:#1d5a94; --accent-ink:#ffffff; --accent-soft:#dbe7f2; --ochre:#a86c0a; --ochre-soft:#f4e6cb;
  --good:#2c7a4c; --good-soft:#dcefe3; --bad:#b0392c; --bad-soft:#f6dedb; --c-soft:#e4e8eb;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --panel:#161f26; --sunk:#1c272f; --ink:#e2e8ed; --muted:#93a2af; --line:#2a3741;
  --accent:#5c9ddb; --accent-ink:#08131d; --accent-soft:#1b3349; --ochre:#e1a641; --ochre-soft:#3a2e17;
  --good:#5cc28a; --good-soft:#173727; --bad:#ec7f72; --bad-soft:#3d1d19; --c-soft:#26323b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --panel:#161f26; --sunk:#1c272f; --ink:#e2e8ed; --muted:#93a2af; --line:#2a3741;
  --accent:#5c9ddb; --accent-ink:#08131d; --accent-soft:#1b3349; --ochre:#e1a641; --ochre-soft:#3a2e17;
  --good:#5cc28a; --good-soft:#173727; --bad:#ec7f72; --bad-soft:#3d1d19; --c-soft:#26323b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.92em}
.r{text-align:right}
.muted{color:var(--muted)}
.b{font-weight:600}
.num,.tab{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:20px;letter-spacing:-.01em}
.brand .mk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-stretch:80%;align-self:center}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.02em}
.ctx{display:flex;gap:8px;align-items:center;flex:1;min-width:0;flex-wrap:wrap}
.ctx select{max-width:320px}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--ochre-soft);color:var(--ochre)}

.shell{display:grid;grid-template-columns:196px minmax(0,1fr);gap:0;min-height:calc(100vh - 52px)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);align-self:start;padding:14px 10px 14px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.side .grp{font:600 10px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 10px 4px}
.nav{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.nav:hover{background:var(--sunk)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .k{font:500 10px var(--f-mono);color:var(--muted);width:18px}
.nav.on .k{color:var(--accent)}
main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}

h1{font:800 26px/1.1 var(--f-display);font-stretch:90%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:700 16px/1.2 var(--f-display);font-stretch:95%;margin:0 0 10px;text-wrap:balance}
h3{font:600 13px var(--f-body);margin:0 0 6px}
.eyebrow{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .sub{color:var(--muted);margin-top:4px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:0;background:none;cursor:pointer;padding:2px 5px;border-radius:4px;color:var(--muted);font-size:13px;line-height:1}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--ochre);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

input[type=text],input[type=number],input[type=month],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted)}
.grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid .w2{grid-column:span 2}
@media (max-width:520px){.grid .w2{grid-column:auto}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel.flush{padding:0;overflow:hidden}
.note{font-size:12.5px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:var(--r);background:var(--ochre-soft);color:var(--ink);font-size:13px;margin-bottom:12px}
.banner b{color:var(--ochre)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.t th{position:sticky;top:0;background:var(--sunk);text-align:left;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.desc{min-width:260px}
.t tr.r-e td{background:var(--accent-soft);font-weight:600}
.t tr.r-s td{background:var(--sunk);font-weight:600}
.t tr.r-v.sel td,.t tr.r-e.sel td,.t tr.r-s.sel td{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--ochre) 12%,transparent)}
.t tr.r-v:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.t tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:var(--panel)}
.t td.n{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.t tr.r-e td.n,.t tr.r-s td.n{color:var(--ink)}
.t .act{white-space:nowrap;text-align:right}
.cell{width:100%;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--panel)}
.cell.q{width:92px;text-align:right}
.cell.h{font-weight:600;text-transform:uppercase}
.tag{display:inline-block;font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tt{display:inline-block;font:600 10px var(--f-body);letter-spacing:.04em;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tt-MAT{background:var(--accent-soft);color:var(--accent)}
.tt-MO{background:var(--ochre-soft);color:var(--ochre)}
.tt-EQ{background:var(--good-soft);color:var(--good)}
.tt-SV,.tt-OUT{background:var(--c-soft);color:var(--muted)}
.tt-C{background:var(--ink);color:var(--panel)}
.cl{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:4px;font:700 11px var(--f-mono)}
.cl-A{background:var(--accent);color:var(--accent-ink)}
.cl-B{background:var(--ochre-soft);color:var(--ochre)}
.cl-C{background:var(--c-soft);color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}
.linkish:hover{text-decoration:underline}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.sumbar{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line)}
.sumbar>div{flex:1 1 160px;padding:10px 14px;border-right:1px solid var(--line)}
.sumbar>div:last-child{border-right:0}
.sumbar .v{font:700 18px var(--f-display);font-stretch:92%;font-variant-numeric:tabular-nums}
.sumbar .big .v{color:var(--accent);font-size:21px}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .nm{font:700 15px/1.25 var(--f-display);font-stretch:95%}
.card .meta{font-size:12px;color:var(--muted)}
.card .tv{font:700 20px var(--f-display);font-stretch:92%;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font:700 21px/1.2 var(--f-display);font-stretch:90%;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.hbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:6px 10px;align-items:center;font-size:12.5px}
.hbar .tr{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .fl{height:100%;background:var(--accent);border-radius:3px}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stackbar>div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c-MAT{background:var(--accent)} .c-MO{background:var(--ochre)} .c-EQ{background:var(--good)} .c-OUT,.c-SV{background:var(--muted)}

svg.chart{width:100%;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font:10px var(--f-body)}
svg .bar-A{fill:var(--accent)} svg .bar-B{fill:var(--ochre)} svg .bar-C{fill:var(--muted);opacity:.55}
svg .bar-m{fill:var(--accent);opacity:.35}
svg .ln{fill:none;stroke:var(--ink);stroke-width:1.8}
svg .dot{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
svg .th{stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1}
svg .thl{fill:var(--bad);font:600 10px var(--f-body)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 4vh) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.dlg.wide{width:min(1060px,100%)}
.dlg .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.res{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.blk{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.blk h3{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:6px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 16px var(--f-display);margin-bottom:6px}
.crono input{width:58px;text-align:right;padding:3px 4px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.src{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.src a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink)}
.src a b{display:block;color:var(--accent)}
.src a span{font-size:12px;color:var(--muted)}
.tog{width:18px;height:18px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer;font:600 12px/1 var(--f-mono);margin-right:6px;padding:0}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:8;flex-direction:row;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
  .side .grp{display:none}
  .nav{white-space:nowrap}
  .nav .k{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mk">R$</span>OrçaLivre <small>orçamento de obras</small></div>
  <div class="ctx" id="ctx"></div>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"><div class="empty"><b>Carregando…</b>Preparando bases e orçamentos.</div></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf4=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const R=v=>nf2.format(v||0), Q=v=>nf4.format(v||0), P=v=>nf2.format(v||0)+'%';
const r2=v=>Math.round(((v||0)+Number.EPSILON)*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const str=v=>v==null?'':String(v).trim();
function num(v){ if(typeof v==='number') return v; if(v==null) return NaN; let s=String(v).trim().replace(/R\$|\s|%/g,''); if(!s) return NaN; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s); }
const cleanCode=v=>{ let s=str(v); if(!s) return ''; if(/^\d+\.0+$/.test(s)) s=s.replace(/\.0+$/,''); return s; };
const fmtMes=m=>{ if(!m) return '—'; const [y,mm]=String(m).split('-'); return mm?`${mm}/${y}`:m; };
const TL={MAT:'Material',MO:'Mão de obra',EQ:'Equipamento',SV:'Serviço',OUT:'Outros'};
const TS={MAT:'MAT',MO:'M.O.',EQ:'EQUIP',SV:'SERV',OUT:'OUTROS'};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3400); }
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch{ return false; } };

/* ============ estado ============ */
const S={view:'orcs',bases:{},docs:[],cur:null,sel:null,cache:new Map(),
  q:{q:'',t:'C',pk:null}, pk:{}, insF:{t:'*',e:'*',q:''}, abc:'serv', exp:new Set(), modalR:null, saving:'', imp:null};

/* ============ armazenamento das bases (IndexedDB, neste navegador) ============ */
const IDB={ db:null,
  open(){ return new Promise(res=>{ try{ const rq=indexedDB.open('orcalivre',1); rq.onupgradeneeded=()=>rq.result.createObjectStore('bases',{keyPath:'id'}); rq.onsuccess=()=>{this.db=rq.result;res(true)}; rq.onerror=()=>res(false); }catch{ res(false); } }); },
  all(){ return new Promise(res=>{ if(!this.db) return res([]); try{ const rq=this.db.transaction('bases').objectStore('bases').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]); }catch{ res([]); } }); },
  put(b){ return new Promise(res=>{ if(!this.db) return res(false); try{ const {_ix,...clean}=b; const tx=this.db.transaction('bases','readwrite'); tx.objectStore('bases').put(clean); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }catch{ res(false); } }); },
  del(id){ return new Promise(res=>{ if(!this.db) return res(false); try{ const tx=this.db.transaction('bases','readwrite'); tx.objectStore('bases').delete(id); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch{ res(false);} }); }
};

/* ============ armazenamento dos orçamentos (nuvem do artefato ou navegador) ============ */
const Store={ mode:'local', sb:null, user:null, q:{},
  async init(){
    const C=window.ORCALIVRE||{};
    if(!(C.supabaseUrl&&C.supabaseAnonKey&&window.supabase)) return;
    try{ this.sb=supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data}=await this.sb.auth.getSession(); this.user=data.session?.user||null; if(this.user) this.mode='db';
      this.sb.auth.onAuthStateChange((ev,ses)=>setTimeout(()=>onAuth(ev,ses),0)); }catch(e){ this.sb=null; }
  },
  tbl(){ return this.sb.from('orcalivre_docs'); },
  async list(){
    if(this.mode==='db'){ const {data,error}=await this.tbl().select('id,data').limit(5000); if(!error) return data.map(r=>({...r.data,id:r.id})); this.fallback(error); }
    return lsGet('orcalivre.docs',[]);
  },
  fallback(e){ if(this.mode!=='db') return; this.mode='local'; renderCtx(); toast('Sem conexão com a sua conta. Salvando neste navegador até reconectar.'); },
  localWrite(){ const ok=lsSet('orcalivre.docs',S.docs.filter(d=>!d.ex)); if(!ok) toast('Não foi possível salvar neste navegador.'); },
  async put(doc){ const clean=JSON.parse(JSON.stringify(doc)); delete clean.ex;
    const {error}=await this.tbl().upsert({user_id:this.user.id,id:doc.id,kind:doc.kind,data:clean,updated_at:new Date().toISOString()},{onConflict:'user_id,id'}); if(error) throw error; },
  async save(doc){
    const i=S.docs.findIndex(d=>d.id===doc.id); if(i<0) S.docs.push(doc); else S.docs[i]=doc;
    if(this.mode==='db'){ const prev=this.q[doc.id]||Promise.resolve();
      const p=prev.then(()=>this.put(doc)).catch(()=>new Promise(r=>setTimeout(r,1200)).then(()=>this.put(doc))).catch(e=>{ this.fallback(e); this.localWrite(); });
      this.q[doc.id]=p; return p; }
    this.localWrite();
  },
  async del(id){
    S.docs=S.docs.filter(d=>d.id!==id);
    if(this.mode==='db'){ await (this.q[id]||Promise.resolve()); const {error}=await this.tbl().delete().eq('id',id); if(error){ this.fallback(error); this.localWrite(); } return; }
    this.localWrite();
  }
};
async function onAuth(ev,ses){
  if(ev==='PASSWORD_RECOVERY'){ Store.user=ses?.user||null; Store.mode='db'; newPassModal(); return; }
  if(ev==='SIGNED_IN'){ const was=Store.user?.id; Store.user=ses.user; Store.mode='db'; if(was===ses.user.id&&S.docs.length) { renderCtx(); return; } await loadDocs(true); return; }
  if(ev==='SIGNED_OUT'){ Store.user=null; Store.mode='local'; S.cur=null; await loadDocs(false); go('orcs'); }
}
async function loadDocs(migrar){
  let docs=(await Store.list()).filter(d=>d&&d.kind);
  if(migrar&&Store.mode==='db'){ const loc=lsGet('orcalivre.docs',[]).filter(d=>d&&d.kind&&!docs.some(x=>x.id===d.id));
    if(loc.length){ S.docs=docs; for(const d of loc) await Store.save(d); docs=S.docs; lsSet('orcalivre.docs',[]); toast(`${loc.length} registro(s) deste navegador foram levados para a sua conta.`); } }
  S.docs=docs; rebuildOwn(); S.saving='ok';
  if(S.cur&&!S.cur.ex) S.cur=S.docs.find(d=>d.id===S.cur.id)||null;
  render();
}

async function authGo(){ const f=readForm('#fAuth'), msg=$('#authMsg'), m=S.authMode, sb=Store.sb; const say=t=>{ if(msg) msg.textContent=t; };

function pkId(pk){ if(!pk) pk=defPk(); if(pk.src==='SINAPI') return `SINAPI:${pk.mes}:${pk.uf}:${pk.reg}`; if(pk.src==='CDHU') return 'CDHU:'+(PUB.man?.cdhu?.versao||202); return pk.src; }

function ensureBase(id){

      cat.comp.forEach((r,i)=>{ b.comps[r[0]]={d:r[1],u:r[2],g:cat.g[r[3]],ct:cat.ct[r[4]]||'',c:R.c[i],it:catItems(cat,i,5)}; });

function budgetBaseIds(o){ const s=new Set([o.base]); for(const it of o.items) if(it.k==='V'&&it.b) s.add(it.b); for(const d of S.docs) if(d.kind==='cpu') for(const x of d.it||[]) if(x.b) s.add(x.b); return [...s].filter(Boolean); }

function refInfo(bid,t,c){ const b=S.bases[bid]; if(!b) return null; return t==='I'?b.ins[c]:b.comps[c]; }
function compUnit(bid,code,depth=0){
  const k=bid+'|'+code; if(S.cache.has(k)) return S.cache.get(k);
  const c=S.bases[bid]?.comps[code]; if(!c) return null;
  let v;
  if(c.c!=null&&isFinite(c.c)) v=c.c;
  else{ if(depth>25) return 0; v=0; for(const it of c.it||[]) v+=(itemUnit(it.b||bid,it,depth)||0)*it.q; }
  S.cache.set(k,v); return v;
}
function itemUnit(bid,it,depth=0){ if(it.t==='I') return S.bases[bid]?.ins[it.c]?.p??null; return compUnit(bid,it.c,depth+1); }
function refUnit(bid,t,c){ return t==='I'?(S.bases[bid]?.ins[c]?.p??null):compUnit(bid,c); }
function explode(bid,code,qty,acc,depth){
  const c=S.bases[bid]?.comps[code]; if(!c||!(c.it&&c.it.length)||depth>25) return false;
  for(const it of c.it){ const b=it.b||bid; if(it.t==='I'){ const k=b+'|'+it.c; acc.set(k,(acc.get(k)||0)+qty*it.q); } else if(!explode(b,it.c,qty*it.q,acc,depth+1)){ const k='#'+b+'|'+it.c; acc.set(k,(acc.get(k)||0)+qty*it.q); } }
  return true;
}
function getIdx(b,kind){ b._ix=b._ix||{}; if(!b._ix[kind]){ const src=kind==='C'?b.comps:b.ins; b._ix[kind]=Object.keys(src).map(c=>({c,k:norm(c+' '+(src[c].d||''))})); } return b._ix[kind]; }
function search(q,bf,tipo,limit=150){
  const terms=norm(q).split(/\s+/).filter(Boolean), out=[];
  for(const b of Object.values(S.bases)){ if(b.id!==bf) continue;
    for(const kind of (tipo==='*'?['C','I']:[tipo])){ for(const e of getIdx(b,kind)){ if(terms.every(t=>e.k.includes(t))){ out.push({b:b.id,t:kind,c:e.c}); if(out.length>=limit) return out; } } } }
  return out;
}
function typeOf(cls,u,d){
  const x=norm(cls); if(/MAO DE OBRA|MAO-DE-OBRA/.test(x)) return 'MO'; if(/EQUIP/.test(x)) return 'EQ'; if(/MATERIA/.test(x)) return 'MAT'; if(/SERVI/.test(x)) return 'SV'; if(/TAXA|ENCARG/.test(x)) return 'OUT';
  const U=norm(u).trim(), D=norm(d);
  if(/^CH[PI]$/.test(U)) return 'EQ';
  if(U==='H'||U==='MES'){ if(/(CAMINHAO|BETONEIRA|ESCAVADEIRA|TRATOR|ROLO |GUINDA|COMPRESSOR|VIBRADOR|BOMBA|RETRO|MOTONIVEL|CARREGADEIRA|GERADOR|PERFURATRIZ|MARTELETE|SERRA |EQUIPAMENTO|MAQUINA|GRUA|ELEVADOR|ANDAIME|LOCACAO|USINA|VEICULO|CAMIONETE)/.test(D)) return 'EQ'; return 'MO'; }
  return 'MAT';
}

/* ============ cálculo do orçamento ============ */
function bdiOf(o){ const b=o.bdi||{}; if(b.manual) return (num(b.v)||0)/100; const f=k=>(num(b[k])||0)/100; const I=f('pis')+f('cofins')+f('iss')+f('cprb'); if(I>=1) return 0; return ((1+f('ac')+f('s')+f('r')+f('g'))*(1+f('df'))*(1+f('l')))/(1-I)-1; }
function calc(o){
  const bdi=bdiOf(o), b2=(num(o.bdi2)||0)/100, rows=[], grp={}, tot={cd:0,pv:0};
  let e=0,s=0,v=0,cE=null,cS=null;
  for(const it of o.items){
    if(it.k==='E'){ e++; s=0; v=0; cE=it; cS=null; grp[it.id]={cd:0,pv:0,n:0}; rows.push({it,n:String(e)}); }
    else if(it.k==='S'){ s++; v=0; cS=it; grp[it.id]={cd:0,pv:0,n:0}; rows.push({it,n:`${e}.${s}`,eId:cE?.id}); }
    else{ v++; const n=cS?`${e}.${s}.${v}`:`${e}.${v}`; const cu=num(it.cu)||0, q=num(it.q)||0, pu=r2(cu*(1+(it.bd2?b2:bdi))), tc=r2(q*cu), tp=r2(q*pu);
      tot.cd+=tc; tot.pv+=tp; for(const g of [cE,cS]) if(g&&grp[g.id]){ grp[g.id].cd+=tc; grp[g.id].pv+=tp; grp[g.id].n++; }
      rows.push({it,n,cu,q,pu,tc,tp,eId:cE?.id,sId:cS?.id}); }
  }
  tot.cd=r2(tot.cd); tot.pv=r2(tot.pv); tot.bdiV=r2(tot.pv-tot.cd);
  return {rows,grp,tot,bdi,b2};
}
function explodeBudget(o,eF='*'){
  const {rows}=calc(o), acc=new Map(), manual=[];
  for(const r of rows){ if(r.it.k!=='V') continue; if(eF!=='*'&&r.eId!==eF) continue; const it=r.it;
    if(it.t==='I'&&S.bases[it.b]?.ins[it.c]){ const k=it.b+'|'+it.c; acc.set(k,(acc.get(k)||0)+r.q); }
    else if(it.t==='C'&&explode(it.b,it.c,r.q,acc,0)){} else manual.push(r); }
  const list=[];
  for(const [k,q] of acc){ if(k[0]==='#'){ const [b,...cc]=k.slice(1).split('|'); const c=cc.join('|'); const info=S.bases[b]?.comps[c]; const p=compUnit(b,c)||0; list.push({b,c,d:(info?.d||c)+' (composição sem analítico)',u:info?.u||'',t:'OUT',q,p,v:q*p}); continue; }
    const [b,...cc]=k.split('|'); const c=cc.join('|'); const i=S.bases[b]?.ins[c]; const p=i?.p||0; list.push({b,c,d:i?.d||'(insumo não encontrado na base)',u:i?.u||'',t:i?.t||'OUT',q,p,v:q*p}); }
  for(const r of manual) list.push({b:r.it.b||'',bl:r.it.bl,c:r.it.c||'—',d:r.it.d+(r.it.t==='M'?' (serviço sem composição)':' (base não carregada)'),u:r.it.u,t:'OUT',q:r.q,p:r.cu,v:r.tc,manual:true});
  list.sort((a,b)=>b.v-a.v); return {list,manual:manual.length};
}
function abcClass(list,A,B){ const total=list.reduce((s,x)=>s+x.v,0)||1; let acc=0; return list.map(x=>{ const before=acc/total*100; acc+=x.v; return {...x,pct:x.v/total*100,cum:acc/total*100,cl:before<A?'A':before<B?'B':'C'}; }); }
function abcServ(o){ const {rows}=calc(o); const list=rows.filter(r=>r.it.k==='V').map(r=>({n:r.n,b:r.it.b,bl:r.it.bl,c:r.it.c,d:r.it.d,u:r.it.u,q:r.q,p:r.pu,v:r.tp})).sort((a,b)=>b.v-a.v); return abcClass(list,num(o.abcA)||80,num(o.abcB)||95); }
function etapas(o){ return o.items.filter(i=>i.k==='E'); }
function stagger(o){ const es=etapas(o), N=Math.max(1,Math.round(num(o.prazo)||1)), cr={}; es.forEach((e,i)=>{ const st=Math.min(N-1,Math.floor(i*N/es.length)); const len=Math.min(N-st,Math.max(1,Math.ceil(N/es.length)+1)); const arr=Array(N).fill(0); let rest=100; for(let m=0;m<len;m++){ const v=m===len-1?rest:r2(100/len); arr[st+m]=v; rest=r2(rest-v); } cr[e.id]=arr; }); return cr; }

function ensureOwn(){ const o=S.cur; if(!o||!o.ex) return; const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.ex=false; c.nome=o.nome+' (cópia)'; S.cur=c; S.docs.push(c); lsSet('orcalivre.last',c.id); toast('O exemplo virou um orçamento seu: "'+c.nome+'".'); }

/* ============ estrutura (inserir, mover, excluir) ============ */
const endE=(it,i)=>{ let j=i+1; while(j<it.length&&it[j].k!=='E') j++; return j; };
const endS=(it,i)=>{ let j=i+1; while(j<it.length&&it[j].k==='V') j++; return j; };
function insertItem(o,n){
  const it=o.items, si=it.findIndex(x=>x.id===S.sel);
  if(n.k!=='E'&&!it.some(x=>x.k==='E')) it.push({id:uid(),k:'E',d:'NOVA ETAPA'});
  if(n.k==='E'||si<0){ it.push(n); S.sel=n.id; return; }
  const sel=it[si]; let pos;
  if(n.k==='S'){ let ei=si; while(ei>0&&it[ei].k!=='E') ei--; pos=endE(it,ei); }
  else{ if(sel.k==='V') pos=si+1; else if(sel.k==='S') pos=endS(it,si); else{ pos=si+1; while(pos<it.length&&it[pos].k==='V') pos++; } }
  it.splice(pos,0,n); S.sel=n.id;
}
function blockEnd(it,i){ return it[i].k==='V'?i+1:it[i].k==='S'?endS(it,i):endE(it,i); }
function moveItem(o,id,dir){
  const it=o.items, i=it.findIndex(x=>x.id===id); if(i<0) return; const k=it[i].k;
  if(k==='V'){ const j=i+dir; if(j<1||j>=it.length) return; [it[i],it[j]]=[it[j],it[i]]; return; }
  const a=i,b=blockEnd(it,i);
  if(dir<0){ let p=a-1; while(p>=0&&it[p].k!==k&&!(k==='S'&&it[p].k==='E')) p--; if(p<0||it[p].k!==k) return; const seg=it.splice(a,b-a); it.splice(p,0,...seg); }
  else{ if(b>=it.length||it[b].k!==k) return; const c=blockEnd(it,b); const seg=it.splice(b,c-b); it.splice(a,0,...seg); }
}
function delItem(o,id){ const it=o.items, i=it.findIndex(x=>x.id===id); if(i<0) return; const b=blockEnd(it,i); it.splice(i,b-i); if(o.crono) delete o.crono[id]; }

function pareto(list,A,B){
  const N=Math.min(list.length,80), it=list.slice(0,N), W=860,H=290,ml=46,mr=42,mt=16,mb=36, iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(...it.map(x=>x.pct),0.01), bw=iw/N; let g='',bars='',pts=[];
  for(let k=0;k<=4;k++){ const y=mt+ih-ih*k/4; g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="ax" x="${W-mr+6}" y="${y+3}">${k*25}%</text><text class="ax" x="${ml-6}" y="${y+3}" text-anchor="end">${nf2.format(max*k/4).replace(/,00$/,'')}%</text>`; }
  it.forEach((x,i)=>{ const h=x.pct/max*ih, X=ml+i*bw; bars+=`<rect class="bar-${x.cl}" x="${(X+bw*0.12).toFixed(1)}" y="${(mt+ih-h).toFixed(1)}" width="${Math.max(1,bw*0.76).toFixed(1)}" height="${h.toFixed(1)}"><title>${esc(x.d)} — ${P(x.pct)} (acum. ${P(x.cum)})</title></rect>`; pts.push(`${(X+bw/2).toFixed(1)},${(mt+ih-x.cum/100*ih).toFixed(1)}`); });
  const th=(v,l)=>{ const y=mt+ih-v/100*ih; return `<line class="th" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="thl" x="${ml+6}" y="${y-4}">${l} ${v}%</text>`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva ABC">${g}${bars}${th(A,'Limite A')}${th(B,'Limite B')}<polyline class="ln" points="${pts.join(' ')}"/>
   <text class="ax" x="${ml}" y="${H-10}">Itens em ordem decrescente de valor${list.length>N?` (primeiros ${N} de ${list.length})`:` (${N})`} · barras: % do item (eixo esquerdo) · linha: % acumulado (eixo direito)</text></svg>`;
}

VIEWS.ind=()=>{
  const o=S.cur, {tot,grp,bdi}=calc(o), {list}=explodeBudget(o); const byT={}; let hMO=0;

  const cd=list.reduce((s,x)=>s+x.v,0)||0; const es=etapas(o); const maxE=Math.max(...es.map(e=>grp[e.id]?.pv||0),1);
  const nServ=o.items.filter(i=>i.k==='V').length, a=num(o.area)||0, cub=num(o.cub)||0;
  const k=(l,v,s)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  return `<div class="head"><div><div class="eyebrow">Resumo gerencial</div><h1>Indicadores</h1><div class="sub">${nServ} serviços em ${es.length} etapas · ${esc(labelOf(o.base))}</div></div></div>
  <div class="kpis" style="margin-bottom:16px">
   ${k('Preço total (com BDI)','R$ '+R(tot.pv))}${k('Custo direto','R$ '+R(tot.cd))}${k('BDI aplicado',P(bdi*100),'R$ '+R(tot.bdiV))}
   ${k('Preço por m²',a?'R$ '+R(tot.pv/a):'—',a?Q(a)+' m² de área':'Informe a área em Dados da obra')}${k('Custo direto por m²',a?'R$ '+R(tot.cd/a):'—')}
   ${k('Horas de mão de obra',nf0.format(hMO)+' h',a?nf2.format(hMO/a)+' h/m²':'')}
   ${k('Comparação com CUB',cub&&a?P(tot.pv/a/cub*100):'—',`<label style="display:flex;gap:6px;align-items:center;margin-top:4px">CUB R$/m² <input data-bind="cub" data-num value="${cub?R(cub):''}" style="width:90px" inputmode="decimal" aria-label="CUB de referência"></label>`)}
  </div>
  <div class="two"><div class="panel"><h2>Composição do custo direto</h2>
    <div class="stackbar">${['MAT','MO','EQ','OUT'].map(t=>byT[t]?`<div class="c-${t}" style="width:${byT[t]/cd*100}%" title="${TL[t]} ${P(byT[t]/cd*100)}"></div>`:'').join('')}</div>
    <div class="legend">${['MAT','MO','EQ','OUT'].map(t=>`<span><i class="c-${t}"></i>${TL[t]} <b>${P(cd?(byT[t]||0)/cd*100:0)}</b></span>`).join('')}</div>
    <p class="note">Decomposição pelas composições unitárias. Serviços sem composição entram em Outros.</p></div>
   <div class="panel"><h2>Distribuição por etapa</h2><div class="hbar">${es.map(e=>{ const v=grp[e.id]?.pv||0; return `<div class="lb" title="${esc(e.d)}">${esc(e.d)}</div><div class="tr"><div class="fl" style="width:${v/maxE*100}%"></div></div><div class="tab">${P(tot.pv?v/tot.pv*100:0)}</div>`; }).join('')||'<div class="note">Sem etapas.</div>'}</div></div></div>`;
};

VIEWS.crono=()=>{
  const o=S.cur, {grp,tot}=calc(o), es=etapas(o), N=Math.max(1,Math.min(60,Math.round(num(o.prazo)||1))); o.crono=o.crono||{};
  const mon=Array(N).fill(0); let warn=0;
  const rowsH=es.map(e=>{ const arr=(o.crono[e.id]||[]).slice(0,N); while(arr.length<N) arr.push(0); const s=arr.reduce((a,b)=>a+(num(b)||0),0); if(Math.abs(s-100)>0.01&&(grp[e.id]?.pv||0)>0) warn++; const v=grp[e.id]?.pv||0; arr.forEach((p,m)=>mon[m]+=v*(num(p)||0)/100);
    return `<tr><td class="desc b">${esc(e.d)}<div class="note">R$ ${R(v)}</div></td>${arr.map((p,m)=>`<td><input data-cr="${e.id}" data-m="${m}" value="${p?nf2.format(p):''}" inputmode="decimal" aria-label="${esc(e.d)} mês ${m+1}"></td>`).join('')}<td class="r ${Math.abs(s-100)>0.01?'':'muted'}" style="${Math.abs(s-100)>0.01?'color:var(--bad);font-weight:600':''}">${P(s)}</td></tr>`; }).join('');
  let acc=0; const cum=mon.map(v=>acc+=v);
  return `<div class="head"><div><div class="eyebrow">Físico-financeiro</div><h1>Cronograma</h1><div class="sub">Percentual de execução de cada etapa por mês. Prazo: ${N} meses.</div></div>
  <div class="actions"><label class="chk">Prazo <input data-bind="prazo" data-num value="${N}" style="width:56px" inputmode="numeric"> meses</label><button class="btn" data-act="cronoU">Distribuir uniforme</button><button class="btn" data-act="cronoS">Escalonar etapas</button>
  <button class="btn" data-act="exp" data-r="crono" data-f="xlsx">Excel</button><button class="btn" data-act="exp" data-r="crono" data-f="pdf">PDF</button></div></div>
  ${warn?`<div class="banner"><b>${warn} etapa(s)</b> não somam 100%. Ajuste os percentuais (coluna Total).</div>`:''}
  ${es.length?`<div class="panel flush crono" style="margin-bottom:14px"><div class="scroll"><table class="t"><thead><tr><th>Etapa</th>${mon.map((_,m)=>`<th class="r">Mês ${m+1}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${rowsH}
   <tr class="tot"><td>Desembolso no mês (R$)</td>${mon.map(v=>`<td class="r">${R(v)}</td>`).join('')}<td class="r">${R(mon.reduce((a,b)=>a+b,0))}</td></tr>
   <tr><td class="b">Acumulado (R$)</td>${cum.map(v=>`<td class="r">${R(v)}</td>`).join('')}<td></td></tr>
   <tr><td class="b">Acumulado (%)</td>${cum.map(v=>`<td class="r">${P(tot.pv?v/tot.pv*100:0)}</td>`).join('')}<td></td></tr></tbody></table></div></div>
   <div class="panel"><h2>Curva S</h2>${curveS(mon,cum,tot.pv)}</div>`:'<div class="empty"><b>Sem etapas</b>Crie etapas na planilha para montar o cronograma.</div>'}`;
};
function curveS(mon,cum,total){ const N=mon.length, W=860,H=240,ml=70,mr=40,mt=14,mb=30,iw=W-ml-mr,ih=H-mt-mb, mx=Math.max(...mon,1), bw=iw/N; let g='',b='',pts=[];
  for(let k=0;k<=4;k++){ const y=mt+ih-ih*k/4; g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="ax" x="${W-mr+6}" y="${y+3}">${k*25}%</text><text class="ax" x="${ml-6}" y="${y+3}" text-anchor="end">${nf0.format(mx*k/4/1000)} mil</text>`; }
  mon.forEach((v,i)=>{ const h=v/mx*ih, X=ml+i*bw; b+=`<rect class="bar-m" x="${X+bw*.2}" y="${mt+ih-h}" width="${bw*.6}" height="${h}"><title>Mês ${i+1}: R$ ${R(v)}</title></rect><text class="ax" x="${X+bw/2}" y="${H-12}" text-anchor="middle">${i+1}</text>`; pts.push(`${(X+bw/2).toFixed(1)},${(mt+ih-(total?cum[i]/total:0)*ih).toFixed(1)}`); });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S">${g}${b}<polyline class="ln" points="${pts.join(' ')}"/>${pts.map(p=>{const [x,y]=p.split(',');return `<circle class="dot" cx="${x}" cy="${y}" r="3"/>`}).join('')}</svg>
   <p class="note">Barras: desembolso mensal (eixo esquerdo, R$). Linha: percentual acumulado (eixo direito).</p>`; }

function qState(key){ return key==='q'?S.q:key==='m'?S.modalQ:S.cpuQ; }
function srcList(own){ const L=[]; if(PUB.man?.sinapi) L.push(['SINAPI','SINAPI · Caixa']); if(PUB.man?.cdhu) L.push(['CDHU','CDHU · SP']);
  for(const b of Object.values(S.bases)) if(!b.pub&&b.id!=='PROPRIA') L.push([b.id,(b.nome||baseShort(b))+' (importada)']);
  if(own) L.push(['PROPRIA','Composições próprias']); return L; }
function picker(key,own){ const pk=key==='plan'||key==='new'?S.pk[key]:qState(key).pk; const M=PUB.man?.sinapi;
  const sel=(k,opts)=>`<select data-pk="${key}" data-k="${k}" aria-label="${k}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(pk[k])===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  let h=sel('src',srcList(own));
  if(pk.src==='SINAPI'&&M){ h+=sel('mes',M.meses.map(m=>[m,fmtMes(m)]))+sel('uf',M.ufs.map(u=>[u,u]))+sel('reg',[['SD','Não desonerado'],['CD','Desonerado'],['SE','Sem encargos complementares']]); }
  return h; }
function searchBar(key){ const st=qState(key); return `<input data-sq="${key}" data-k="q" placeholder="Buscar por código ou descrição (ex.: alvenaria bloco cerâmico)" value="${esc(st.q)}" style="flex:1;min-width:200px" aria-label="Buscar">
  ${picker(key,key!=='m'||true)}<select data-sq="${key}" data-k="t" aria-label="Tipo"><option value="C" ${st.t==='C'?'selected':''}>Composições</option><option value="I" ${st.t==='I'?'selected':''}>Insumos</option><option value="*" ${st.t==='*'?'selected':''}>Ambos</option></select>`; }
function refreshRes(key){ const box=$('#res-'+key); if(box) box.innerHTML=resTable(qState(key),key); }
function resTable(st,key){
  const bid=pkId(st.pk);
  if(!S.bases[bid]){ if(!parseId(bid)) return '<div class="empty"><b>Base indisponível</b>Escolha outra base.</div>';
    ensureBase(bid).then(b=>{ const box=$('#res-'+key); if(!box) return; box.innerHTML=b?resTable(st,key):'<div class="empty"><b>Não foi possível carregar a base</b>Verifique a conexão e tente novamente.</div>'; });
    return '<div class="empty"><b>Carregando a base…</b>'+esc(labelOf(bid))+'</div>'; }
  const lim=key==='q'?200:120, res=search(st.q,bid,st.t,lim); if(!res.length) return '<div class="empty"><b>Nada encontrado</b>Tente outros termos, outro tipo (composição/insumo) ou outra base.</div>';
  const canAdd=key!=='q'||!!S.cur;

    return `<tr><td class="mono"><button class="linkish mono" data-act="comp" data-b="${esc(r.b)}" data-t="${r.t}" data-c="${esc(r.c)}">${esc(r.c)}</button></td><td><span class="tt tt-${r.t==='C'?'C':(i.t||'MAT')}">${r.t==='C'?'COMP':TS[i.t||'MAT']}</span></td><td class="desc">${esc(i.d)}${i.g&&r.t==='C'?` <span class="note">· ${esc(i.g)}</span>`:''}</td><td>${esc(i.u)}</td><td class="r">${u==null?'<span class="note" title="Sem preço nesta referência">sem preço</span>':R(u)}${i.as?' <span class="tag" title="Preço atribuído de São Paulo (sem coleta nesta UF)">AS</span>':''}</td>
    <td class="act">${canAdd?`<button class="btn sm" data-act="${key==='cpu'?'cpuAdd':'addRef'}" data-b="${esc(r.b)}" data-t="${r.t}" data-c="${esc(r.c)}">${key==='cpu'?'Incluir':'Adicionar'}</button>`:''}</td></tr>`; }).join('')}</tbody></table>${res.length>=lim?'<p class="note" style="padding:8px">Mostrando os primeiros resultados. Refine a busca.</p>':''}`;

function compRows(bid,c,depth,path){ let h='';
  for(const it of c.it||[]){ const b2=it.b||bid, info=refInfo(b2,it.t,it.c), un=itemUnit(b2,it,0), key=path+'/'+b2+'|'+it.c, isC=it.t==='C', open=S.exp.has(key);

     <td><span class="tt tt-${isC?'C':(info?.t||'OUT')}">${isC?'COMP':TS[info?.t||'OUT']}</span></td><td class="desc">${esc(info?.d||'(não encontrado na base)')}</td><td>${esc(info?.u||'')}</td><td class="r">${Q(it.q)}</td><td class="r">${un==null?'—':R(un)}${info?.as?' <span class="tag" title="Preço atribuído de São Paulo">AS</span>':''}</td><td class="r">${R((un||0)*it.q)}</td></tr>`;
    if(isC&&open){ const sub=S.bases[b2]?.comps[it.c]; if(sub&&depth<8) h+=compRows(b2,sub,depth+1,key); } }
  return h; }

async function cmpUF(){ const {b,t,c}=S.det, p=parseId(b); if(!p) return; const ufs=PUB.man.sinapi.ufs;

  if($('#modal').hidden) return; const info=refInfo(b,t,c); const vals=rows.map(x=>x[p.reg]).filter(v=>v!=null); const mn=Math.min(...vals), mx=Math.max(...vals);
  S.cmpRows=rows; modal(()=>dlg(`<div class="eyebrow">SINAPI ${fmtMes(p.mes)} · por estado</div><h2 style="margin:4px 0 0"><span class="mono">${esc(c)}</span> · ${esc(info?.d||'')}</h2>`,
   `<div class="res"><table class="t"><thead><tr><th>UF</th><th class="r">Não desonerado</th><th class="r">Desonerado</th><th class="r">Sem encargos</th><th class="r">vs. ${p.uf}</th></tr></thead><tbody>${rows.map(x=>{ const base=rows.find(y=>y.uf===p.uf)?.[p.reg]; const v=x[p.reg]; const d=base&&v!=null?(v/base-1)*100:null;
     return `<tr${x.uf===p.uf?' class="r-s"':''}><td class="b">${x.uf}</td>${['SD','CD','SE'].map(r=>`<td class="r ${r===p.reg?'b':''}" style="${r===p.reg&&v===mn?'color:var(--good)':r===p.reg&&v===mx?'color:var(--bad)':''}">${x[r]==null?'—':R(x[r])}</td>`).join('')}<td class="r muted">${d==null?'':(d>0?'+':'')+nf2.format(d)+'%'}</td></tr>`; }).join('')}</tbody></table></div>
   <p class="note" style="margin:0">Verde: menor custo no regime selecionado (${REG[p.reg]}); vermelho: maior.</p>`,'<button class="btn" data-act="close">Fechar</button>',true)); }

/* ============ importação de base ============ */
function impModal(){ S.imp={wb:null,file:'',aoa:{},meta:{nome:'',fonte:'SINAPI',uf:'SP',data:'',regime:'N'},blk:{ins:{},comp:{},an:{}}}; modal(renderImp); }
const BLK={ins:{t:'Insumos (preços)',cols:[['cod','Código',1],['desc','Descrição',1],['und','Unidade',0],['preco','Preço',1],['cls','Classificação / tipo',0]]},
  comp:{t:'Composições (custos)',cols:[['cod','Código',1],['desc','Descrição',1],['und','Unidade',0],['custo','Custo unitário',1],['grupo','Grupo',0]]},
  an:{t:'Analítico (itens de cada composição)',cols:[['comp','Código da composição',1],['tipo','Tipo do item',0],['item','Código do item',1],['coef','Coeficiente',1],['desc','Descrição',0],['und','Unidade',0]]}};
function aoaOf(name){ const I=S.imp; if(!I.aoa[name]){ const ws=I.wb.Sheets[name]; I.aoa[name]=ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false}):[]; } return I.aoa[name]; }
function guessHdr(a){ for(let r=0;r<Math.min(40,a.length);r++){ const row=(a[r]||[]).map(norm); const sc=row.filter(x=>/COD|DESCRI|UNID|^UN$|^UND$/.test(x)).length; if(sc>=2) return r; } return 0; }
function labels(a,h){ let mx=0; for(let r=Math.max(0,h-3);r<=Math.min(a.length-1,h+3);r++) mx=Math.max(mx,(a[r]||[]).length); const L=[];
  for(let j=0;j<mx;j++){ const parts=[]; for(let r=Math.max(0,h-2);r<=h;r++){ const v=str((a[r]||[])[j]); if(v&&!parts.includes(v)) parts.push(v); } L.push(parts.join(' / ')); } return L; }
function ufCol(a,h,uf){ const U=norm(uf).trim(); if(!U) return -1; for(let r=Math.max(0,h-3);r<=h;r++){ const row=a[r]||[]; for(let j=0;j<row.length;j++) if(norm(row[j]).trim()===U) return j; } return -1; }
function guessSheet(kind){ const ns=S.imp.wb.SheetNames, D=S.imp.meta.regime==='D';
  const pick=(re)=>ns.find(n=>re.test(norm(n).trim()));
  if(ns.length===1) return kind==='ins'?ns[0]:'';
  if(kind==='ins') return pick(D?/^ICD$/:/^ISD$/)||pick(/INSUM/)||'';
  if(kind==='comp') return pick(D?/^CCD$/:/^CSD$/)||pick(/COMPOSI(?!.*ANALIT)|CUSTO/)||'';
  return pick(/ANALIT/)||''; }
function guessBlk(kind){ const I=S.imp, b=I.blk[kind]; if(!b.sheet){ b.cols={}; return; } const a=aoaOf(b.sheet); if(b.hdr==null) b.hdr=guessHdr(a); const L=labels(a,b.hdr).map(norm); const g=(...re)=>{ for(const x of re){ const j=L.findIndex(l=>x.test(l)); if(j>=0) return j; } return -1; };
  const c={};
  if(kind==='an'){ c.comp=g(/COD.*COMPOS/,/COMPOSI/); c.tipo=g(/TIPO/); c.item=g(/COD.*ITEM/,/ITEM/); c.coef=g(/COEF/); c.desc=g(/DESCRI.*ITEM/,/DESCRI/); c.und=g(/UNID/,/^UND/,/^UN$/); }
  else{ c.cod=g(/COD/); c.desc=g(/DESCRI/); c.und=g(/UNID/,/^UND/,/^UN\b/); const uf=ufCol(a,b.hdr,I.meta.uf);
    if(kind==='ins'){ c.preco=uf>=0?uf:g(/PRECO/,/CUSTO/,/VALOR/); c.cls=g(/CLASSIF/,/TIPO/,/CATEG/); } else { c.custo=uf>=0?uf:g(/CUSTO/,/PRECO/,/VALOR/,/TOTAL/); c.grupo=g(/GRUPO/); } }
  b.cols=c; }
function renderImp(){ const I=S.imp, M=I.meta;
  if(!I.wb) return dlg('<h2 style="margin:0">Importar base de preços</h2>',`<p style="margin:0">Selecione a planilha baixada do site oficial (XLSX, XLS, ODS ou CSV). Para o SINAPI, baixe o arquivo XLSX do mês em caixa.gov.br/sinapi, descompacte o .zip e escolha a planilha de referência.</p>
    <label class="btn primary" style="align-self:flex-start">Escolher arquivo<input type="file" id="impFile" accept=".xlsx,.xls,.xlsm,.ods,.csv" hidden></label>${I.loading?'<p class="note">Lendo o arquivo… arquivos grandes podem levar alguns segundos.</p>':''}${window.XLSX?'':'<p class="note" style="color:var(--bad)">O leitor de planilhas não carregou. Recarregue a página.</p>'}`,'<button class="btn" data-act="close">Cancelar</button>',true);
  const sOpts=sel=>`<option value="">— não importar —</option>`+I.wb.SheetNames.map(n=>`<option ${sel===n?'selected':''}>${esc(n)}</option>`).join('');
  const blocks=Object.entries(BLK).map(([k,def])=>{ const b=I.blk[k]; let inner='';
    if(b.sheet){ const a=aoaOf(b.sheet); const L=labels(a,b.hdr||0); const opt=(sel)=>`<option value="-1">—</option>`+L.map((l,j)=>`<option value="${j}" ${sel===j?'selected':''}>${XLSX.utils.encode_col(j)} · ${esc(l.slice(0,48)||'(sem título)')}</option>`).join('');
      const ex=(a[(b.hdr||0)+1]||[]);
      inner=`<div class="grid"><label class="field"><span>Linha do cabeçalho</span><input data-imp="${k}" data-k="hdr" value="${(b.hdr||0)+1}" inputmode="numeric"></label>${def.cols.map(([ck,cl,req])=>`<label class="field"><span>${cl}${req?' *':''}</span><select data-imp="${k}" data-k="col:${ck}">${opt(b.cols[ck]??-1)}</select>${(b.cols[ck]??-1)>=0?`<span class="note" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ex.: ${esc(str(ex[b.cols[ck]]).slice(0,40))}</span>`:''}</label>`).join('')}</div><span class="note">${nf0.format(Math.max(0,a.length-(b.hdr||0)-1))} linhas abaixo do cabeçalho.</span>`; }
    return `<div class="blk"><h3>${def.t}</h3><label class="field"><span>Aba da planilha</span><select data-imp="${k}" data-k="sheet">${sOpts(b.sheet)}</select></label>${inner}</div>`; }).join('');
  return dlg(`<h2 style="margin:0">Importar base de preços</h2><div class="note">${esc(I.file)} · ${I.wb.SheetNames.length} aba(s). Confira as colunas identificadas.</div>`,
   `<div class="grid" id="fImp"><label class="field w2"><span>Nome da base</span><input data-meta="nome" value="${esc(M.nome)}" placeholder="Ex.: SINAPI SP 09/2026"></label><label class="field"><span>Fonte</span><select data-meta="fonte">${['SINAPI','SICRO','ORSE','SEINFRA','SBC','EMOP','SIURB','FDE','PRÓPRIA','OUTRA'].map(f=>`<option ${M.fonte===f?'selected':''}>${f}</option>`).join('')}</select></label>
    <label class="field"><span>UF</span><input data-meta="uf" value="${esc(M.uf)}" maxlength="2" style="text-transform:uppercase"></label><label class="field"><span>Data-base</span><input type="month" data-meta="data" value="${esc(M.data)}"></label><label class="field"><span>Encargos</span><select data-meta="regime"><option value="N" ${M.regime==='N'?'selected':''}>Não desonerado</option><option value="D" ${M.regime==='D'?'selected':''}>Desonerado</option></select></label></div>
    <p class="note" style="margin:0">A UF é usada para localizar a coluna de preço quando a planilha traz um preço por estado (como no SINAPI).</p>${blocks}`,
   `<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="doImp">Importar</button>`,true); }
function readImpFile(file){ const I=S.imp; I.loading=true; I.file=file.name; remodal(); const fr=new FileReader();
  fr.onload=()=>{ try{ I.wb=XLSX.read(new Uint8Array(fr.result),{type:'array',dense:true}); }catch(e){ I.loading=false; remodal(); toast('Não foi possível ler este arquivo.'); return; }
    I.loading=false; const m=file.name.match(/(20\d\d)[-_ .]?(0[1-9]|1[0-2])/); if(m) I.meta.data=`${m[1]}-${m[2]}`;
    if(/SICRO/i.test(file.name)) I.meta.fonte='SICRO'; else if(/ORSE/i.test(file.name)) I.meta.fonte='ORSE';
    if(/DESON|_CD|ICD|CCD/i.test(file.name)&&!/SEM.?DESON|NAO.?DESON/i.test(norm(file.name))) I.meta.regime='D';
    for(const k of ['ins','comp','an']){ I.blk[k]={sheet:guessSheet(k),hdr:null,cols:{}}; guessBlk(k); }
    I.meta.nome=`${I.meta.fonte} ${I.meta.uf} ${fmtMes(I.meta.data)}`; remodal(); };
  fr.onerror=()=>{ I.loading=false; remodal(); toast('Não foi possível ler este arquivo.'); }; fr.readAsArrayBuffer(file); }
async function doImport(){ const I=S.imp, M=I.meta; const base={id:'B'+uid(),nome:M.nome||`${M.fonte} ${M.uf}`,fonte:M.fonte,uf:norm(M.uf).trim(),data:M.data,regime:M.regime,ins:{},comps:{},criado:Date.now()};
  const B=I.blk; const col=(row,j)=>j==null||j<0?null:row[j];
  const need=(k,keys)=>keys.every(x=>(B[k].cols[x]??-1)>=0);
  if(B.ins.sheet&&!need('ins',['cod','desc','preco'])){ toast('Insumos: indique as colunas de código, descrição e preço.'); return; }

        const info=refInfo(bid,it.t,it.c), u=info?refUnit(bid,it.t,it.c):null; if(!info||u==null){ miss++; continue; }
        it.b=bid; it.bl=baseShort(b); it.cu=r2(u); it.d=info.d; it.u=info.u; ok++; }
      o.base=bid; if(np&&np.src==='SINAPI'&&!o.bdi.manual){ const want=np.reg==='CD'?4.5:0, cur=num(o.bdi.cprb)||0; if((cur===0||cur===4.5)&&cur!==want){ o.bdi.cprb=want; cp=want?' CPRB de 4,5% incluída no BDI.':' CPRB retirada do BDI.'; } } });
    S.pk.plan=pkFromId(S.cur.base); render(); toast(`${ok} serviço(s) reprecificado(s) com ${labelOf(bid)}${miss?`; ${miss} sem o código nessa base (mantidos)`:''}.${cp}`); },
  exp:d=>exportRep(d.r,d.f), copy:d=>copyRep(d.r), backup:()=>backup(),
  imp:()=>impModal(), doImp:()=>doImport(),
  delBase:d=>{ const b=S.bases[d.id]; confirmBox(`Remover a base <b>${esc(b.nome||baseLong(b))}</b> deste navegador? Os orçamentos mantêm os preços já lançados.`,'Remover',async()=>{ await IDB.del(d.id); delete S.bases[d.id]; S.cache.clear(); render(); }); },
  newCpu:()=>cpuModal(), editCpu:d=>cpuModal(S.docs.find(x=>x.id===d.id)),
  dupCpu:()=>{ const {b,c}=S.det, src=S.bases[b].comps[c]; cpuModal(null); Object.assign(S.ed,{d:src.d+' (ADAPTADA)',u:src.u,g:src.g||'',it:(src.it||[]).map(x=>({t:x.t,b:x.b||b,c:x.c,q:x.q}))}); remodal(); },
  cpuAdd:d=>{ syncCpuForm(); S.ed.it.push({t:d.t,b:d.b,c:d.c,q:1}); remodal(); },
  cpuDel:d=>{ syncCpuForm(); S.ed.it.splice(+d.i,1); remodal(); },
  cpuSave:async()=>{ syncCpuForm(); const e=S.ed; if(!e.c||!e.d){ toast('Informe código e descrição.'); return; } if(S.docs.some(x=>x.kind==='cpu'&&x.c===e.c&&x.id!==e.id)){ toast('Já existe uma composição própria com esse código.'); return; }
    if(e.it.some(x=>x.b==='PROPRIA'&&x.t==='C'&&x.c===e.c)){ toast('A composição não pode conter ela mesma.'); return; }
    await Store.save(e); rebuildOwn(); closeModal(); render(); toast('Composição salva.'); },
  newIns:()=>insModal(), editIns:d=>insModal(S.docs.find(x=>x.id===d.id)),
  insSave:async()=>{ const f=readForm('#fIns'); const id=$('#fIns').dataset.id; if(!str(f.c)||!str(f.d)){ toast('Informe código e descrição.'); return; } if(S.docs.some(x=>x.kind==='ins'&&x.c===str(f.c)&&x.id!==id)){ toast('Já existe um insumo próprio com esse código.'); return; }
    await Store.save({id,kind:'ins',c:str(f.c),d:str(f.d).toUpperCase(),u:str(f.u).toUpperCase(),p:num(f.p)||0,t:f.t,fonte:str(f.fonte)}); rebuildOwn(); closeModal(); render(); toast('Insumo salvo.'); },
  delOwn:d=>{ const x=S.docs.find(y=>y.id===d.id); confirmBox(`Excluir <b>${esc(x.c)} · ${esc(x.d)}</b>? Serviços já lançados mantêm o preço, mas deixam de ter decomposição.`,'Excluir',async()=>{ await Store.del(d.id); rebuildOwn(); render(); }); }
};
function syncCpuForm(){ const f=readForm('#fCpu'); Object.assign(S.ed,{c:str(f.c),d:str(f.d).toUpperCase(),u:str(f.u).toUpperCase(),g:str(f.g)}); }

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(a){ e.preventDefault(); const fn=ACT[a.dataset.act]; if(fn) fn(a.dataset,a,e); return; }
  if(e.target===$('#modal')){ closeModal(); return; }
  const row=e.target.closest('tr[data-row]'); if(row){ S.sel=row.dataset.row; document.querySelectorAll('tr[data-row].sel').forEach(r=>r.classList.remove('sel')); row.classList.add('sel'); }
});
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='fAuth') authGo(); if(e.target.id==='fPass') passGo(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden) closeModal(); if(e.key==='Enter'&&e.target.closest('#fAuth,#fPass')){ e.preventDefault(); e.target.closest('#fAuth')?authGo():passGo(); return; } if(e.key==='Enter'&&e.target.matches('input.cell,input[data-bind],input[data-bdi],input[data-cr]')) e.target.blur(); });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.sq&&t.dataset.k==='q'){ const key=t.dataset.sq, st=qState(key); st.q=t.value; clearTimeout(t._d); t._d=setTimeout(()=>refreshRes(key),160); }
  if(t.dataset.live==='insF.q'){ S.insF.q=t.value; clearTimeout(t._d); t._d=setTimeout(()=>{ const o=S.cur, F=S.insF; const {list}=explodeBudget(o,F.e); const tq=norm(F.q).split(/\s+/).filter(Boolean); const vis=list.filter(x=>(F.t==='*'||x.t===F.t)&&tq.every(w=>norm(x.c+' '+x.d).includes(w))); $('#insTbl').innerHTML=insTable(vis,list.reduce((s,x)=>s+x.v,0)); },200); }
});
document.addEventListener('change',e=>{ const t=e.target, ds=t.dataset;
  if(t.id==='impJson'&&t.files[0]) return importJson(t.files[0]);
  if(t.id==='impFile'&&t.files[0]) return readImpFile(t.files[0]);
  if(ds.sq&&ds.k!=='q'){ qState(ds.sq)[ds.k]=t.value; refreshRes(ds.sq); return; }
  if(ds.pk){ const key=ds.pk, pk=(key==='plan'||key==='new')?S.pk[key]:qState(key).pk; pk[ds.k]=t.value; if(!pk.mes) Object.assign(pk,{mes:latestMes(),uf:'SP',reg:'SD'});
    if(key==='plan'||key==='q'){ render(); return; } if(key==='cpu') syncCpuForm(); if(key==='new'){ const f=readForm('#fNew'); remodal(); for(const [k,v] of Object.entries(f)){ const e=$('#fNew [name="'+k+'"]'); if(e) e.value=v; } return; } remodal(); return; }
  if(ds.set){ const [o,k]=ds.set.split('.'); S[o][k]=t.value; render(); return; }
  if(ds.bind!=null){ const k=ds.bind; let v=t.value; if(ds.num!=null){ v=num(v); if(!isFinite(v)) v=0; }
    mutate(o=>{ o[k]=v; if(k==='prazo'){ o.prazo=Math.max(1,Math.min(60,Math.round(v)||1)); } },{rerender:!['nome','cliente','local'].includes(k)}); if(['nome','cliente','local'].includes(k)) renderCtx(); return; }
  if(ds.q){ const v=num(t.value); mutate(o=>{ const it=o.items.find(x=>x.id===ds.q); it.q=isFinite(v)?v:0; }); return; }
  if(ds.cu){ const v=num(t.value); mutate(o=>{ const it=o.items.find(x=>x.id===ds.cu); it.cu=r2(isFinite(v)?v:0); }); return; }
  if(ds.d){ mutate(o=>{ o.items.find(x=>x.id===ds.d).d=t.value.toUpperCase(); }); return; }
  if(ds.fd){ mutate(o=>{ o.items.find(x=>x.id===ds.fd).d=t.value.toUpperCase(); },{rerender:false}); return; }
  if(ds.fu){ mutate(o=>{ o.items.find(x=>x.id===ds.fu).u=t.value.toUpperCase(); },{rerender:false}); return; }
  if(ds.fc){ mutate(o=>{ o.items.find(x=>x.id===ds.fc).c=t.value; },{rerender:false}); return; }
  if(ds.cr){ const v=num(t.value); mutate(o=>{ o.crono=o.crono||{}; const N=Math.max(1,Math.round(num(o.prazo)||1)); const a=(o.crono[ds.cr]||[]).slice(0,N); while(a.length<N) a.push(0); a[+ds.m]=isFinite(v)?r2(v):0; o.crono[ds.cr]=a; }); return; }
  if(ds.bdi){ const v=num(t.value); mutate(o=>{ o.bdi[ds.bdi]=isFinite(v)?v:0; }); return; }
  if(ds.bdim!=null){ mutate(o=>{ o.bdi.manual=t.checked; if(t.checked) o.bdi.v=r2(bdiOf({bdi:{...o.bdi,manual:false}})*100); }); return; }
  if(ds.cq!=null){ const v=num(t.value); syncCpuForm(); S.ed.it[+ds.cq].q=isFinite(v)?v:0; remodal(); return; }
  if(ds.meta){ const I=S.imp; I.meta[ds.meta]=ds.meta==='uf'?t.value.toUpperCase():t.value; if(ds.meta==='uf'||ds.meta==='regime'){ if(ds.meta==='regime') for(const k of ['ins','comp','an']){ I.blk[k]={sheet:guessSheet(k),hdr:null,cols:{}}; } for(const k of ['ins','comp','an']) guessBlk(k); remodal(); } return; }
  if(ds.imp){ const b=S.imp.blk[ds.imp]; if(ds.k==='sheet'){ b.sheet=t.value; b.hdr=null; guessBlk(ds.imp); } else if(ds.k==='hdr'){ b.hdr=Math.max(0,(parseInt(t.value)||1)-1); guessBlk(ds.imp); } else b.cols[ds.k.slice(4)]=+t.value; remodal(); return; }
});

/* ============ início ============ */
(async function boot(){
  rebuildOwn(); render();
  try{ PUB.man=await getJSON('dados/bases.json'); }catch{ PUB.man=null; }
  S.q.pk=defPk(); ensureBase(pkId(defPk()));
  await IDB.open(); for(const b of await IDB.all()) S.bases[b.id]=b;
  await Store.init(); await loadDocs(Store.mode==='db');
  const last=lsGet('orcalivre.last',null); const o=last&&S.docs.find(d=>d.id===last&&d.kind==='orc');
  if(o){ S.cur=o; S.view='plan'; S.pk.plan=pkFromId(o.base); ensureBudget(o); }
  const h=(location.hash||'').slice(1); if(h&&VIEWS[h]) S.view=h;
  render();
})();
</script>
